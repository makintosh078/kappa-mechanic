<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EFF1F1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Kappa Mechanic" />
    <meta name="description" content="Локальный журнал дежурного механика" />
    <link rel="icon" href="/kappa-mechanic/icons/kappa.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/kappa-mechanic/icons/apple-touch-icon.png" />
    <title>Kappa Mechanic — Журнал дежурного механика</title>
    <style>
      #root:not(:empty) + #startup { display: none; }
      #startup {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #eff1f1;
        color: #22292f;
        font: 1rem/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #startup section {
        width: min(100%, 380px);
        box-sizing: border-box;
        padding: 24px;
        border-radius: 22px;
        border: 1px solid #d9e1ea;
        background: #fff;
      }
      #startup h1 { margin: 0 0 12px; font-size: 1.5rem; line-height: 1.2; }
      #startup p { margin: 0 0 12px; }
      #startup button {
        min-height: 48px;
        padding: 8px 16px;
        border: 0;
        border-radius: 14px;
        background: #193c99;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        #startup { background: #141c27; color: #eef3fa; }
        #startup section { background: #202c39; border-color: #3d4b5a; }
        #startup button { background: #2952b8; }
      }
    </style>
    <script>
      (function () {
        var startupFailed = false
        function showStartupError() {
          startupFailed = true
          var root = document.getElementById('root')
          var title = document.getElementById('startup-message')
          if (!root || root.hasChildNodes() || !title) return
          title.textContent = 'Не удалось загрузить приложение'
          document.getElementById('startup-help').hidden = false
          document.getElementById('startup-retry').hidden = false
        }
        window.addEventListener('error', function (event) {
          if (event.target instanceof HTMLScriptElement || event.target === window) showStartupError()
        }, true)
        document.addEventListener('click', function (event) {
          if (event.target.id === 'startup-retry') window.location.reload()
        })
        document.addEventListener('DOMContentLoaded', function () {
          if (startupFailed) showStartupError()
        })
        window.setTimeout(showStartupError, 12000)
      })()
    </script>
    <script type="module" crossorigin src="/kappa-mechanic/assets/index-DOF97res.js"></script>
  <link rel="manifest" href="/kappa-mechanic/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
    <main id="startup">
      <section>
        <h1>Kappa Mechanic</h1>
        <p id="startup-message" role="status">Загружаем журнал…</p>
        <p id="startup-help" hidden>Проверьте подключение к интернету и попробуйте ещё раз.</p>
        <button id="startup-retry" type="button" hidden>Повторить загрузку</button>
        <noscript><p>Разрешите JavaScript в настройках Safari и обновите страницу.</p></noscript>
      </section>
    </main>
  </body>
</html>
